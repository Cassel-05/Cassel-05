name: Generate GitHub Stats Images

on:
  schedule:
    - cron: "0 */6 * * *"   # se regenera cada 6 horas
  workflow_dispatch:         # también puedes lanzarlo manualmente
  push:
    branches:
      - main

jobs:
  generate-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate stats images
        uses: jstrieb/github-stats@master
        with:
          username: Cassel-05
          exclude_repos:
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/
          git commit -m "Update generated files" || echo "No changes to commit"
          git push
